spring:
  application:
    name: speiseplan-backend
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:speiseplan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  tomcat:
    # Bounded so bursts queue up instead of exhausting the small instance's memory.
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
    accept-count: 100
    connection-timeout: 10s
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  security:
    google-oauth-enabled: ${GOOGLE_OAUTH_ENABLED:false}
    token-secret: ${TOKEN_SIGNING_SECRET:dev-only-insecure-token-secret-change-me}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}