spring:
  application:
    name: speiseplan-backend
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/speiseplan}
    username: ${SPRING_DATASOURCE_USERNAME:speiseplan}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}