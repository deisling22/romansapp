spring:
  application:
    name: speiseplan-backend
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:speiseplan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  security:
    google-oauth-enabled: ${GOOGLE_OAUTH_ENABLED:false}
    token-secret: ${TOKEN_SIGNING_SECRET:dev-only-insecure-token-secret-change-me}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}