<main class="screen">
  <section *ngIf="user; else loadingAccount" class="auth-panel" aria-labelledby="account-title">
    <img *ngIf="user.pictureUrl" class="avatar" [src]="user.pictureUrl" alt="" />
    <p class="eyebrow">Angemeldet mit Google</p>
    <h1 id="account-title">Hallo {{ user.firstName }} {{ user.lastName }}</h1>
    <dl class="user-details">
      <div>
        <dt>Vorname</dt>
        <dd>{{ user.firstName }}</dd>
      </div>
      <div>
        <dt>Nachname</dt>
        <dd>{{ user.lastName }}</dd>
      </div>
      <div>
        <dt>E-Mail</dt>
        <dd>{{ user.email }}</dd>
      </div>
    </dl>
  </section>
  <ng-template #loadingAccount>
    <section class="auth-panel" aria-labelledby="account-title">
      <p class="eyebrow">Konto wird geladen …</p>
    </section>
  </ng-template>
</main>
