<router-outlet></router-outlet>

@if ((connectivity.online$ | async) === false) {
  <p class="offline-banner" role="status">
    Offline – Änderungen werden synchronisiert, sobald du wieder online bist.
  </p>
}

@if (updateAvailable) {
  <p class="update-banner" role="status">
    Neue Version verfügbar.
    <button type="button" (click)="reloadForUpdate()">Aktualisieren</button>
  </p>
}

<div *ngIf="menuOpen" class="quick-menu" role="menu" aria-label="Weitere Bereiche">
  <a routerLink="/settings" role="menuitem" (click)="closeMenu()">Einstellungen</a>
  <a routerLink="/account" role="menuitem" (click)="closeMenu()">Konto & Anmeldung</a>
</div>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <span>Übersicht</span>
  </a>
  <a routerLink="/plans" routerLinkActive="active">
    <span>Pläne</span>
  </a>
  <a routerLink="/dishes" routerLinkActive="active">
    <span>Gerichte</span>
  </a>
  <button
    type="button"
    class="menu-trigger"
    aria-label="Weitere Bereiche öffnen"
    [attr.aria-expanded]="menuOpen"
    aria-controls="quick-menu"
    (click)="toggleMenu()">
    <span aria-hidden="true">+</span>
  </button>
</nav>
