<router-outlet></router-outlet>

@if ((connectivity.online$ | async) === false) {
  <p class="offline-banner" role="status">
    Offline – Änderungen werden synchronisiert, sobald du wieder online bist.
  </p>
}

@if (updateAvailable) {
  <p class="update-banner" role="status">
    Neue Version verfügbar.
    <button type="button" (click)="reloadForUpdate()">Aktualisieren</button>
  </p>
}

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <span>Übersicht</span>
  </a>
  <a routerLink="/plans" routerLinkActive="active">
    <span>Pläne</span>
  </a>
  <a routerLink="/dishes" routerLinkActive="active">
    <span>Gerichte</span>
  </a>
  <a routerLink="/settings" routerLinkActive="active">
    <span>Einstellungen</span>
  </a>
</nav>
